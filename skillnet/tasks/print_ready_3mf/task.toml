schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/parametric-cad-studio-print_ready_3mf"
description = "Parametric CAD Studio — Export and check print-ready files: Can you turn my enclosure design (enclosure.sc) into a 3MF file I can send to my slicer? Also tell me whether it's actually print-ready: a closed mesh with no h"
keywords = ["skillnet", "parametric-cad-studio", "export-and-check-print-ready-files"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "parametric-cad-studio"
version = 2
task = "print_ready_3mf"
ability = "Export and check print-ready files"
core = true
source = "builder"
judge = "programmatic"
prompt = "Can you turn my enclosure design (enclosure.sc) into a 3MF file I can send to my slicer? Also tell me whether it's actually print-ready: a closed mesh with no holes or gaps, and the right size."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
