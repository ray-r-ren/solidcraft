schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/parametric-cad-studio-measure_hole_spacing"
description = "Parametric CAD Studio — Inspect and measure designs: I'm checking a mounting plate before ordering screws: mount_plate.step. What diameter are the two holes, and what is the centre-to-centre distance between them?"
keywords = ["skillnet", "parametric-cad-studio", "inspect-and-measure-designs"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "parametric-cad-studio"
version = 2
task = "measure_hole_spacing"
ability = "Inspect and measure designs"
core = true
source = "builder"
judge = "programmatic"
prompt = "I'm checking a mounting plate before ordering screws: mount_plate.step. What diameter are the two holes, and what is the centre-to-centre distance between them? Give me both numbers in mm to two decimals."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
