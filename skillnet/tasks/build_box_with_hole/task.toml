schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/parametric-cad-studio-build_box_with_hole"
description = "Parametric CAD Studio — Build a parametric part: I need a simple mounting block for 3D printing: 40 mm wide, 30 mm deep and 20 mm tall, with a 10 mm diameter hole drilled straight through the middle from the t"
keywords = ["skillnet", "parametric-cad-studio", "build-a-parametric-part"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "parametric-cad-studio"
version = 2
task = "build_box_with_hole"
ability = "Build a parametric part"
core = true
source = "builder"
judge = "programmatic"
prompt = "I need a simple mounting block for 3D printing: 40 mm wide, 30 mm deep and 20 mm tall, with a 10 mm diameter hole drilled straight through the middle from the top face to the bottom.\n\nPlease model it as an editable design with the main sizes as named parameters so I can resize it later. Give me the editable design file, a STEP file and an STL file, and tell me the part's volume."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
