engines: []
apt:
  - ca-certificates
  - curl
  - xz-utils
  - libvulkan1
  - mesa-vulkan-drivers
  - libegl1
  - libgl1
  - libgl1-mesa-dri
  - libgbm1
  - libfontconfig1
  - libfreetype6
  - fonts-dejavu-core
  - libxkbcommon0
  - libx11-6
  - libxcursor1
  - libxrandr2
  - libxi6
  - libwayland-client0
pip:
  - numpy==1.26.4
  - trimesh==4.4.9
  - matplotlib==3.9.2
  - pillow==10.4.0
  - networkx==3.3
  - lxml==5.3.0
run:
  - set -e; mkdir -p /opt/solidcraft; cd /tmp; if curl -fsSL -o sc.tgz
    https://github.com/tangency-labs/solidcraft/releases/download/v0.30.1/solidcraft-0.30.1-linux-x86_64.tar.gz;
    then tar -xzf sc.tgz -C /opt/solidcraft; rm -f sc.tgz; else curl -fsSL -o
    sc.deb
    https://github.com/tangency-labs/solidcraft/releases/download/v0.30.1/solidcraft-linux-x86_64.deb
    && dpkg -x sc.deb /opt/solidcraft && rm -f sc.deb; fi
  - set -e; B=$(find /opt/solidcraft -type f -name solidcraft-cli | head -n1);
    test -n "$B"; chmod 755 "$B"; ln -sf "$B" /usr/local/bin/solidcraft-cli
  - mkdir -p /opt/solidcraft/licenses && find /opt/solidcraft -maxdepth 6 -type
    f \( -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname 'THIRD-PARTY*' \) -exec
    cp {} /opt/solidcraft/licenses/ \; || true
smoke:
  - solidcraft-cli --version
  - "! ldd \"$(readlink -f /usr/local/bin/solidcraft-cli)\" | grep 'not found'"
  - solidcraft-cli commands | head -n 20
  - printf
    '{"commands":[{"command":"solid.box","params":{"length":20,"width":10,"height":5}}]}'
    > /tmp/smoke.json && solidcraft-cli run /tmp/smoke.json --out
    /tmp/smoke.step --out /tmp/smoke.stl && test -s /tmp/smoke.step && test -s
    /tmp/smoke.stl
  - python -c "import trimesh; m=trimesh.load('/tmp/smoke.stl'); assert
    abs(m.volume-1000)<1, m.volume; print('stl ok', m.volume)"
  - python -c "import trimesh; m=trimesh.load('/tmp/smoke.stl'); assert m.is_watertight; assert len(m.split(only_watertight=False))==1"
